[project]
name = "starsector-localization-cn"
version = "0.1.0"
description = "远行星号中文汉化项目的仓库工具"
requires-python = ">=3.14,<3.15"
# 主流程使用标准库；alexson 由 Git 子模块提供。
dependencies = []

[project.scripts]
paratranz = "para_tranz.para_tranz_script:main"

[build-system]
requires = ["uv_build==0.11.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "para_tranz"
module-root = ""
source-exclude = [
    "para_tranz/output",
    "para_tranz/logs",
    "**/*.log",
    "**/.git",
    "**/.pytest_cache",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
