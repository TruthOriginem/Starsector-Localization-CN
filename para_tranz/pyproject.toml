[project]
name = "starsector-localization-cn"
version = "0.1.0"
description = "远行星号中文汉化 ParaTranz 工具"
requires-python = ">=3.14,<3.15"
# 主流程使用标准库；alexson 由 Git 子模块提供。
dependencies = []

[project.scripts]
paratranz = "para_tranz.para_tranz_script:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["**/*.py", "/para_tranz_map.json"]
exclude = ["/.venv", "/output", "/logs", "**/__pycache__"]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel.sources]
"" = "para_tranz"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
target-version = "py314"
line-length = 88
force-exclude = true
include = ["*.py", "*.pyi"]
extend-exclude = [
    "output",
    "logs",
    "json_loader/alexson",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "single"
